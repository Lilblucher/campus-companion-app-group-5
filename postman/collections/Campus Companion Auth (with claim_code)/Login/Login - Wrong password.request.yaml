$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "student_number": "{{student_number}}",
      "password": "wrongpassword"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 401', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
