$kind: http-request
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{lecturer_username}}",
      "password": "{{lecturer_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Role is lecturer', function () {
          pm.expect(pm.response.json().role).to.eql('lecturer');
          pm.collectionVariables.set('lecturer_token', json.token);
      });
    language: text/javascript
order: 2000
