$kind: http-request
url: "{{base_url}}/api/auth/logout"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{jwt_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
