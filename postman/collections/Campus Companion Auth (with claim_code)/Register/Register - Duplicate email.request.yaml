$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Duplicate Email",
      "student_number": "{{dup_email_num}}",
      "programme_code": "IT",
      "email": "{{email}}",
      "phone": "{{phone}}",
      "claim_code": "{{dup_email_claim}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rand9 = () => Array.from({length: 9}, () => Math.floor(Math.random() * 10)).join('');
      pm.collectionVariables.set('dup_email_num', rand9());
      pm.collectionVariables.set('dup_email_claim', 'CLM-' + Math.random().toString(36).substring(2, 8).toUpperCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
      });
      pm.test('Error is email already registered', function () {
          pm.expect(pm.response.json().error).to.eql('email already registered');
      });
    language: text/javascript
order: 3000
