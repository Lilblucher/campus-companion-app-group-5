$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Short Password",
      "student_number": "{{tmp_num}}",
      "programme_code": "IT",
      "email": "{{tmp_email}}",
      "phone": "{{phone}}",
      "claim_code": "{{tmp_claim}}",
      "password": "abc"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rand9 = () => Array.from({length: 9}, () => Math.floor(Math.random() * 10)).join('');
      pm.collectionVariables.set('tmp_num', rand9());
      pm.collectionVariables.set('tmp_email', `shortpw${Date.now()}@mulungushi.edu.zm`);
      pm.collectionVariables.set('tmp_claim', 'CLM-' + Math.random().toString(36).substring(2, 8).toUpperCase());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 400', function () {
          pm.response.to.have.status(400);
      });
      pm.test('Error mentions password', function () {
          pm.expect(pm.response.json().error).to.include('password');
      });
    language: text/javascript
order: 10000
