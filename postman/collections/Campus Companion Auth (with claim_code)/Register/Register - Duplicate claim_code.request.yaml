$kind: http-request
url: "{{base_url}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Duplicate Claim",
      "student_number": "{{dup_claim_num}}",
      "programme_code": "IT",
      "email": "{{dup_claim_email}}",
      "phone": "{{phone}}",
      "claim_code": "{{claim_code}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const rand9 = () => Array.from({length: 9}, () => Math.floor(Math.random() * 10)).join('');
      pm.collectionVariables.set('dup_claim_num', rand9());
      pm.collectionVariables.set('dup_claim_email', `dupclaim${Date.now()}@mulungushi.edu.zm`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status is 409', function () {
          pm.response.to.have.status(409);
      });
      pm.test('Error is claim_code already used', function () {
          pm.expect(pm.response.json().error).to.eql('claim_code already used');
      });
    language: text/javascript
order: 4000
